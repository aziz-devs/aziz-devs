<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Accent Blue Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <!-- Background Card -->
  <rect width="850" height="220" rx="16" fill="url(#bg-grad)"/>
  
  <!-- Grid overlay -->
  <rect width="850" height="220" rx="16" fill="url(#grid)"/>

  <!-- Top Accent Border Line -->
  <rect x="0" y="0" width="850" height="4" rx="2" fill="url(#accent-grad)"/>

  <!-- Decorative Tech Geometry / Ambient Orbs -->
  <circle cx="760" cy="50" r="120" fill="#38bdf8" fill-opacity="0.04" filter="url(#glow)"/>
  <circle cx="790" cy="160" r="90" fill="#6366f1" fill-opacity="0.05" filter="url(#glow)"/>
  
  <!-- Code Icon Visual Graphic on Right -->
  <g transform="translate(680, 55)" stroke="url(#accent-grad)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Octagon/Hexagon -->
    <polygon points="50,0 100,28 100,85 50,113 0,85 0,28" stroke-opacity="0.3" stroke-width="1.5" />
    <!-- Brackets -->
    <path d="M 35 42 L 20 57 L 35 72" filter="url(#subtle-glow)" />
    <path d="M 65 42 L 80 57 L 65 72" filter="url(#subtle-glow)" />
    <line x1="56" y1="38" x2="44" y2="76" stroke="#60a5fa" stroke-width="2" />
  </g>

  <!-- Terminal / Status Indicator -->
  <g transform="translate(50, 42)">
    <rect x="0" y="0" width="90" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="14" cy="12" r="4" fill="#22c55e" filter="url(#subtle-glow)"/>
    <text x="26" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">ACTIVE</text>
  </g>

  <!-- Title / Name -->
  <text x="50" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="42" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
    AZIZ
  </text>

  <!-- Subtitle -->
  <text x="50" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="url(#accent-grad)" letter-spacing="0.5">
    Computer Science Student &amp; Aspiring Software Engineer
  </text>

  <!-- Pill Tags -->
  <!-- Tag 1 -->
  <g transform="translate(50, 165)">
    <rect width="135" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="67.5" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#e2e8f0" text-anchor="middle">Full-Stack Dev</text>
  </g>
  <!-- Tag 2 -->
  <g transform="translate(195, 165)">
    <rect width="145" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="72.5" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#e2e8f0" text-anchor="middle">Shopify Development</text>
  </g>
  <!-- Tag 3 -->
  <g transform="translate(350, 165)">
    <rect width="135" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="67.5" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#e2e8f0" text-anchor="middle">AI &amp; Automation</text>
  </g>

</svg>
